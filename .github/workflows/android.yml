name: Android beta
on:
  push:
    branches: [main, work]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and build
        run: ./gradlew :core:test testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --no-daemon
      - name: Inspect APK and merged manifest
        run: python3 scripts/check_apk.py
      - uses: actions/upload-artifact@v4
        with:
          name: shiyan-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            core/build/reports/tests/
            app/build/reports/
      - name: Checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > SHA256SUMS.txt
      - name: Publish prerelease
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/debug/app-debug.apk SHA256SUMS.txt --prerelease --title "拾言 $GITHUB_REF_NAME" --notes-file docs/RELEASE.md
        # This step uses only the workflow-scoped GITHUB_TOKEN.
    permissions:
      contents: write
