name: Android beta
on:
  push:
    branches: [main, work]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify preinstalled Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar" || { echo "::error::Runner is missing Android SDK 35"; exit 1; }
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2" || { echo "::error::Runner is missing Build Tools 35.0.0"; exit 1; }
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and build
        shell: bash
        run: |
          set +e
          ./gradlew :core:test testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --no-daemon > build.log 2>&1
          result=$?
          cat build.log
          if [ "$result" -ne 0 ]; then
            python3 - <<'PYERROR'
          from pathlib import Path
          text = "\n".join(Path("build.log").read_text().splitlines()[-60:])
          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error title=Gradle failed::" + text)
          PYERROR
          fi
          exit "$result"
      - name: Inspect APK and merged manifest
        run: python3 scripts/check_apk.py
      - uses: actions/upload-artifact@v4
        with:
          name: shiyan-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            core/build/reports/tests/
            app/build/reports/
      - name: Checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > SHA256SUMS.txt
      - name: Publish prerelease
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A -ci.N tag retries an unpublished release without moving its existing source tag.
          release_tag="${GITHUB_REF_NAME%%-ci.*}"
          gh release create "$release_tag" app/build/outputs/apk/debug/app-debug.apk SHA256SUMS.txt --verify-tag --prerelease --title "拾言 $release_tag" --notes-file docs/RELEASE.md
        # This step uses only the workflow-scoped GITHUB_TOKEN.
    permissions:
      contents: write
