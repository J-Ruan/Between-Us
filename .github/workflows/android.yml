name: Android beta
on:
  push:
    branches: [main, work]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Android platform using runner SDK
        shell: bash
        run: |
          python3 - <<'PYSDK'
          import subprocess
          subprocess.run(["sdkmanager", "--licenses"], input="y\n" * 200, text=True, check=True)
          PYSDK
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and build
        run: ./gradlew :core:test testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --no-daemon
      - name: Inspect APK and merged manifest
        run: python3 scripts/check_apk.py
      - uses: actions/upload-artifact@v4
        with:
          name: shiyan-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            core/build/reports/tests/
            app/build/reports/
      - name: Checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > SHA256SUMS.txt
      - name: Publish prerelease
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A -ci.N tag retries an unpublished release without moving its existing source tag.
          release_tag="${GITHUB_REF_NAME%%-ci.*}"
          gh release create "$release_tag" app/build/outputs/apk/debug/app-debug.apk SHA256SUMS.txt --verify-tag --prerelease --title "拾言 $release_tag" --notes-file docs/RELEASE.md
        # This step uses only the workflow-scoped GITHUB_TOKEN.
    permissions:
      contents: write
